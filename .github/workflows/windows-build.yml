name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Tauri Windows app
        run: npm run tauri -- build --bundles nsis

      - name: Prepare portable package
        shell: pwsh
        run: |
          $portable = "release/portable/AntListener-2026"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item "src-tauri/target/release/ant-listener-2026.exe" "$portable/AntListener-2026.exe"
          Copy-Item "config.example.toml" "$portable/config.toml"
          Copy-Item "README.md" "$portable/README.md"
          Compress-Archive -Path "$portable/*" -DestinationPath "release/AntListener-2026-Portable.zip" -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AntListener-2026-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/AntListener-2026-Portable.zip
          if-no-files-found: error
          retention-days: 30
