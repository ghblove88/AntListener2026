[package]
name = "ant-listener-2026"
version = "0.1.0"
description = "AntListener 2026"
authors = ["AntListener"]
edition = "2021"

[lib]
name = "ant_listener_2026_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2.3.4"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
toml = "0.8"
